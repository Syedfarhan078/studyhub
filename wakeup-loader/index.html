<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyHub — Starting Up…</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,600&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
  :root {
    --paper:        #f3f0e8;
    --paper-deep:   #e7e2d6;
    --sheet:        #fffcf7;
    --ink:          #1c1915;
    --ink-soft:     #3d3832;
    --muted:        #6d655c;
    --faint:        #8a8176;
    --line:         #e3dcd0;
    --line-strong:  #cfc6b6;
    --navy:         #1e3a5f;
    --navy-deep:    #152a46;
    --navy-soft:    #e6edf4;
    --green:        #1d5c3a;
    --green-soft:   #e5f2ea;
    --amber:        #8a5a10;
    --amber-soft:   #f8f1df;
    --red:          #8b1a1a;
    --purple:       #5b2d8e;
    --purple-soft:  #f0ebf8;
    --serif:        "Source Serif 4", Georgia, serif;
    --sans:         "Source Sans 3", "Segoe UI", sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100vh;
    background: var(--paper);
    font-family: var(--sans);
    color: var(--ink);
    overflow-x: hidden;
  }

  /* ── Top accent bar ── */
  .top-bar {
    height: 3px;
    background: linear-gradient(90deg, var(--navy-deep) 0%, var(--navy) 60%, var(--green) 100%);
  }

  /* ── Header / brand ── */
  .site-header {
    background: var(--sheet);
    border-bottom: 1px solid var(--line);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .site-header img.logo {
    height: 36px;
    width: auto;
  }
  .site-header .brand-name {
    font-family: var(--serif);
    font-size: 1.45rem;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.02em;
  }
  .site-header .brand-name span { color: var(--navy); }
  .site-header .brand-tagline {
    font-size: 0.75rem;
    color: var(--muted);
    margin-left: auto;
    font-style: italic;
  }

  /* ── Main layout ── */
  .main-wrap {
    max-width: 760px;
    margin: 48px auto 32px;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* ── Sheet card ── */
  .card-sheet {
    background: var(--sheet);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(28,25,21,.07), 0 1px 3px rgba(28,25,21,.04);
    overflow: hidden;
  }
  .card-body { padding: 32px 36px; }

  /* ── Status section ── */
  .status-row {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 24px;
  }
  .status-icon-wrap {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--navy-soft);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 1.6rem;
    color: var(--navy);
    transition: background .4s, color .4s;
  }
  .status-icon-wrap.ready {
    background: var(--green-soft);
    color: var(--green);
  }
  .status-icon-wrap i { display: block; }
  .spinning { animation: spin 1.2s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .status-text h2 {
    font-family: var(--serif);
    font-size: 1.35rem;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .status-text p {
    font-size: 0.9rem;
    color: var(--muted);
    line-height: 1.5;
  }

  /* ── Progress bar ── */
  .progress-wrap { margin-bottom: 10px; }
  .progress-track {
    height: 7px;
    background: var(--paper-deep);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--navy), #2e6fa8);
    border-radius: 999px;
    transition: width .6s ease, background .5s;
  }
  .progress-fill.done { background: linear-gradient(90deg, var(--green), #2d8f5a); }
  .progress-label {
    font-size: 0.78rem;
    color: var(--faint);
    margin-top: 7px;
    display: flex;
    justify-content: space-between;
  }
  .progress-label .pulse { animation: fade-pulse 1.6s ease-in-out infinite; }
  @keyframes fade-pulse { 0%,100%{opacity:1} 50%{opacity:.45} }

  /* ── Divider ── */
  .divider {
    border: none;
    border-top: 1px solid var(--line);
    margin: 24px 0;
  }

  /* ── Flashcard ── */
  .flashcard-label {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: .07em;
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: 999px;
    display: inline-block;
    margin-bottom: 12px;
  }
  .fc-green  { background: var(--green-soft);  color: var(--green); }
  .fc-amber  { background: var(--amber-soft);  color: var(--amber); }
  .fc-navy   { background: var(--navy-soft);   color: var(--navy);  }
  .fc-purple { background: var(--purple-soft); color: var(--purple);}

  .flashcard-content {
    font-family: var(--serif);
    font-size: 1.08rem;
    line-height: 1.65;
    color: var(--ink-soft);
    min-height: 72px;
  }
  .flashcard-meta {
    font-size: 0.8rem;
    color: var(--faint);
    font-style: italic;
    margin-top: 10px;
  }

  .fc-transition { transition: opacity .35s ease; }
  .fc-hidden     { opacity: 0; }

  /* ── Dot nav ── */
  .dot-nav {
    display: flex;
    gap: 7px;
    margin-top: 20px;
    justify-content: center;
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--line-strong);
    transition: background .3s, transform .3s;
  }
  .dot.active {
    background: var(--navy);
    transform: scale(1.35);
  }

  /* ── Footer ── */
  .site-footer {
    text-align: center;
    font-size: 0.78rem;
    color: var(--faint);
    padding: 20px;
    border-top: 1px solid var(--line);
  }
  .site-footer strong { color: var(--muted); font-weight: 600; }

  /* ── Responsive ── */
  @media (max-width: 540px) {
    .card-body { padding: 22px 20px; }
    .status-text h2 { font-size: 1.1rem; }
    .site-header .brand-tagline { display: none; }
  }
</style>
</head>

// ── State ─────────────────────────────────────────────────────────────────────
let currentCard = 0;
let serverReady  = false;
let cardTimer    = null;

// ── DOM refs ──────────────────────────────────────────────────────────────────
const progressFill  = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');
const progressPct   = document.getElementById('progressPct');
const statusIcon    = document.getElementById('statusIcon');
const statusIconInner = document.getElementById('statusIconInner');
const statusTitle   = document.getElementById('statusTitle');
const statusSubtitle = document.getElementById('statusSubtitle');
const fcBadge       = document.getElementById('fcBadge');
const fcContent     = document.getElementById('fcContent');
const fcMeta        = document.getElementById('fcMeta');
const dotNav        = document.getElementById('dotNav');

// ── Progress labels ───────────────────────────────────────────────────────────
const PROGRESS_STAGES = [
  { pct: 0,   label: 'Connecting to server…'              },
  { pct: 15,  label: 'Server is waking up…'               },
  { pct: 30,  label: 'Allocating compute resources…'      },
  { pct: 50,  label: 'Booting Django application…'        },
  { pct: 70,  label: 'Loading database connections…'      },
  { pct: 85,  label: 'Almost there — finishing startup…'  },
  { pct: 95,  label: 'Server ready — verifying…'          },
];

// ── Build dot nav ─────────────────────────────────────────────────────────────
function buildDots() {
  dotNav.innerHTML = '';
  CARDS.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' active' : '');
    d.addEventListener('click', () => goToCard(i));
    dotNav.appendChild(d);
  });
}

function updateDots() {
  document.querySelectorAll('.dot').forEach((d, i) => {
    d.classList.toggle('active', i === currentCard);
  });
}

// ── Render flashcard ──────────────────────────────────────────────────────────
function showCard(idx, fade = false) {
  const card = CARDS[idx];
  if (fade) {
    [fcBadge, fcContent, fcMeta].forEach(el => el.classList.add('fc-hidden'));
    setTimeout(() => {
      renderCard(card);
      [fcBadge, fcContent, fcMeta].forEach(el => el.classList.remove('fc-hidden'));
    }, 350);
  } else {
    renderCard(card);
  }
  updateDots();
}

function renderCard(card) {
  fcBadge.className   = 'flashcard-label fc-transition ' + card.cls;
  fcBadge.textContent = card.badge;
  fcContent.innerHTML = card.content;
  fcMeta.innerHTML    = card.meta;
}

function goToCard(idx) {
  currentCard = idx;
  showCard(idx, true);
  resetCardTimer();
}

function nextCard() {
  currentCard = (currentCard + 1) % CARDS.length;
  showCard(currentCard, true);
}

function resetCardTimer() {
  if (cardTimer) clearInterval(cardTimer);
  cardTimer = setInterval(nextCard, 8000);
}

// ── Progress bar animation ────────────────────────────────────────────────────
let progressStart = null;

function animateProgress(ts) {
  if (serverReady) return;
  if (!progressStart) progressStart = ts;
  const elapsed = ts - progressStart;
  const raw = Math.min((elapsed / PROGRESS_DURATION_MS) * 95, 95);

  progressFill.style.width = raw + '%';
  progressPct.textContent  = Math.round(raw) + '%';

  // Update label based on stage
  let currentLabel = PROGRESS_STAGES[0].label;
  for (const stage of PROGRESS_STAGES) {
    if (raw >= stage.pct) currentLabel = stage.label;
  }
  progressLabel.textContent = currentLabel;

  requestAnimationFrame(animateProgress);
}

// ── Server ready ──────────────────────────────────────────────────────────────
function onServerReady() {
  if (serverReady) return;
  serverReady = true;

  // Update progress
  progressFill.style.width = '100%';
  progressFill.classList.add('done');
  progressPct.textContent  = '100%';
  progressLabel.textContent = 'Server is ready!';
  progressLabel.classList.remove('pulse');

  // Update icon
  statusIcon.classList.add('ready');
  statusIconInner.className = 'bi bi-check-lg';

  // Update text
  statusTitle.textContent = 'All Set — Redirecting You Now!';
  statusSubtitle.innerHTML = 'StudyHub is up and running. Taking you there in a moment…';

  // Redirect after short pause
  setTimeout(() => {
    window.location.href = STUDYHUB_URL;
  }, 1400);
}

// ── Polling ───────────────────────────────────────────────────────────────────
async function checkBackend() {
  if (serverReady) return;
  try {
    await fetch(STUDYHUB_URL + '/?wake=1', {
      mode:   'no-cors',
      cache:  'no-store',
      signal: AbortSignal.timeout(5000)
    });
    // Opaque success = server responded = it's up
    onServerReady();
  } catch (e) {
    // Network error = still sleeping, retry next interval
  }
}

// ── Boot ──────────────────────────────────────────────────────────────────────
buildDots();
showCard(0);
resetCardTimer();
requestAnimationFrame(animateProgress);

setTimeout(() => {
  checkBackend();
  setInterval(checkBackend, POLL_INTERVAL_MS);
}, POLL_START_DELAY_MS);
</script>
